[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*/migrations/*.py", "staticfiles/*", "static/*", "venv/*"]

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "BLE", "C4", "C90", "COM", "DJ", "DTZ", "E", "EM",
  "ERA", "EXE", "F", "FA", "FBT", "FLY", "G", "I", "ICN", "INP", "INT",
  "ISC", "N", "PD", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "Q",
  "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TC",
  "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
  "RUF012",
  "S101",
  "SIM102",
  # Ruff warns on every run that COM812 conflicts with the formatter.
  "COM812",
  # Line length is the formatter's job.
  "E501",
  # UI text is Mongolian; Ruff reads Cyrillic as lookalike Latin.
  "RUF001",
  "RUF002",
  "RUF003",

  # Pre-existing debt, silenced to get the hooks green on the current code.
  # Counts are from the first full run; each line is its own cleanup task.
  "PLR2004",  # TODO: 26 - magic values in comparisons
  "RET504",   # TODO: 13 - assignment immediately before return
  "PLC0415",  # TODO: 11 - imports inside functions
  "DJ001",    # TODO: 7 - null=True on string model fields
  "RUF005",   # TODO: 7 - concatenation instead of iterable unpacking
  "FBT",      # TODO: 9 - boolean positional arguments
  "TRY",      # TODO: 7 - exception handling style
  "EM",       # TODO: 5 - string literals passed straight to exceptions
  "UP042",    # TODO: 5 - str+Enum classes should be StrEnum
  "C901",     # TODO: 16 - complexity, together with the PLR09xx below
  "PLR0912",
  "PLR0913",
  "PLR0917",
  "PTH",      # TODO: 4 - os.path instead of pathlib
  "BLE001",   # TODO: 3 - blind except Exception
  "SLF001",   # TODO: 3 - private member access
  "SIM105",   # TODO: 3 - together with SIM108
  "SIM108",
  "DJ012",    # TODO: 2 - model body ordering
  "C401",     # TODO: 4 - one-off findings, see git history for locations
  "N806",
  "PERF401",
  "PT011",
]

[tool.ruff.lint.isort]
known-first-party = ["depo_crud", "employee"]

[tool.ruff.lint.per-file-ignores]
# Settings modules and packages are assembled with star imports.
"depo_crud/settings/*.py" = ["F403", "F405"]
"**/__init__.py" = ["F403", "F405"]

# Lint only. Formatting is Prettier's: djlint --reformat and Prettier rewrite
# each other's output forever, so the formatter options are deliberately absent.
[tool.djlint]
profile = "django"
extension = "html"
# H021 (inline styles) is off: mail clients strip <style>, so the email
# templates under account/email and mfa/email have to inline everything.
ignore = "H006,H021,H030,H031"
include = "H017,H035"
