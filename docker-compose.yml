services:
  db:
    image: mysql:8.4
    restart: always
    env_file:
      - .env 
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_HEALTH_USER} -p$${MYSQL_HEALTH_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - depot_management_network

  web:
    build: .
    image: depot_management:1.0 
    container_name: depot_management
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    volumes:
      - staticfiles:/app/staticfiles
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - depot_management_network
    
volumes:
  db_data:
  staticfiles:

networks:
  depot_management_network:
    driver: bridge
