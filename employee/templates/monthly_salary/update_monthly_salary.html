{% extends "forms/update_form.html" %}

{% block title %}Update Monthly Salary{% endblock %}

{% block form_fields %}
<div class="form-group row mb-3">
  <label for="{{ form.hours_per_month.id_for_label }}" class="col-sm-2 col-form-label">Hours per Month</label>
  <div class="col-sm-10">
    {{ form.hours_per_month }}
  </div>
</div>
<div class="form-group row mb-3">
  <label for="{{ form.month.id_for_label }}" class="col-sm-2 col-form-label">Month</label>
  <div class="col-sm-10">
    {{ form.month }}
  </div>
</div>
<div class="form-group row mb-3">
  <label for="{{ form.year.id_for_label }}" class="col-sm-2 col-form-label">Year</label>
  <div class="col-sm-10">
    {{ form.year }}
  </div>
</div>
{% endblock %}
