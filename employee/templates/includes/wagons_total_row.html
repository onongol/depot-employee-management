{% load i18n %}

<tr class="bg-blue-100 font-semibold dark:bg-blue-500/20">
  {% with col_class="px-6 py-3" %}
    <td class="{{ col_class }}">
      {% trans "Total" %}:
    </td>
    <td class="{{ col_class }}">
      {{ wagon_number }}
    </td>
    <td class="{{ col_class }}">
      {{ type_wagon }}
    </td>
    <td class="{{ col_class }}">
       {{ work_name }}
    </td>
    <td class="{{ col_class }}">
      {{ type_work }}
    </td>
    <td class="{{ col_class }}">
      {{ total_amount|floatformat:2 }}
    </td>
    <td class="{{ col_class }}">
      {{ total_time|floatformat:4 }}
    </td>
    <td class="{{ col_class }}">
      {{ total_price|floatformat:2 }}
    </td>
    <td class="{{ col_class }}">
      {{ work_date }}
    </td>
  {% endwith %}
</tr>
