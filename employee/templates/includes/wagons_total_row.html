{% load i18n %}

<tr class="bg-blue-100 font-semibold">
  {% with col_class="px-6 py-3" %}
    <td class="{{ col_class }}">
      {% trans "Total" %}:
    </td>
    <td class="{{ col_class }}"></td>
    <td class="{{ col_class }}"></td>
    <td class="{{ col_class }}">
      {{ total_amount|floatformat:2 }}
    </td>
    <td class="{{ col_class }}">
      {{ total_time|floatformat:4 }}
    </td>
    <td class="{{ col_class }}">
      {{ total_price|floatformat:2 }}
    </td>
    <td class="{{ col_class }}"></td>
  {% endwith %}
</tr>
