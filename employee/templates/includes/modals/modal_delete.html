{% load static %}

{% load i18n %}

<div
  id="deleteModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
  aria-labelledby="deleteModalLabel"
  aria-modal="true"
  role="dialog"
>
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full max-h-screen overflow-y-auto p-6 dark:bg-gray-800 dark:border-gray-700" tabindex="0">
    <h3 class="text-lg text-gray-700 font-semibold mb-2 dark:text-gray-400" id="deleteModalLabel">
      {% trans "Delete" %}
    </h3>
    <p class="mb-4 text-gray-700 dark:text-gray-400">
      {% blocktrans trimmed %}
      Are you sure you want to delete <strong id="deleteDetails"></strong>?<br>
      All records associated with this item will also be deleted.
      {% endblocktrans %}
    </p>
    <div class="flex justify-end gap-2">
      <form method="post" id="deleteForm">
        {% csrf_token %}
        <button
          type="submit"
          class="cursor-pointer px-6 py-2 rounded-md bg-red-600 text-white font-semibold shadow hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-400 transition"
        >
          {% trans "Delete" %}
        </button>
      </form>
      <button
        type="button"
        class="cursor-pointer px-6 py-2 rounded-md bg-gray-100 text-gray-700 font-semibold shadow hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-500"
        onclick="document.getElementById('deleteModal').classList.add('hidden')"
        aria-label="Cancel"
      >
        {% trans "Cancel" %}
      </button>
    </div>
  </div>
</div>
