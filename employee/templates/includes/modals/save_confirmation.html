<!-- Confirmation modal shown when saving updates to an object. Included on edit pages to warn that saving will update related records. -->
{% load static %}
<div id="saveModal"
     class="fixed inset-0 z-50 hidden"
     aria-labelledby="saveModalLabel"
     aria-modal="true"
     role="dialog"
     data-object-name="{{ object_name }}">
    <div class="absolute inset-0 bg-black/50" data-modal-cancel>
        <div class="absolute inset-0 grid place-items-center">
            <div class="max-h-screen w-full max-w-md overflow-y-auto rounded-lg bg-white p-6 shadow-lg dark:border-gray-700 dark:bg-gray-800"
                 tabindex="0">
                <h3 class="mb-2 text-lg font-semibold text-gray-700 dark:text-gray-400"
                    id="saveModalLabel">Save</h3>
                <p class="mb-4 text-sm dark:text-gray-400">
                    Are you sure you want to save these changes
                    <strong id="saveObjectDetails">{{ object_name }}</strong>?
                </p>
                <div class="flex justify-end gap-2">
                    <button type="button"
                            class="cursor-pointer rounded-md bg-blue-700 px-6 py-2 font-semibold text-white shadow transition hover:bg-blue-800 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                            id="confirmSaveButton"
                            aria-label="Confirm save">Save</button>
                    <button type="button"
                            class="cursor-pointer rounded-md bg-gray-100 px-6 py-2 font-semibold text-gray-700 shadow transition hover:bg-gray-200 focus:ring-2 focus:ring-gray-400 focus:outline-none dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-500"
                            data-modal-cancel
                            aria-label="Cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
