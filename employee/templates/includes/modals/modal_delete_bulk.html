{% load static %}
{% load i18n %}
<div id="bulkDeleteModal"
     class="fixed inset-0 z-50 hidden"
     aria-labelledby="bulkDeleteModalLabel"
     aria-modal="true"
     role="dialog">
    <div class="absolute inset-0 bg-black/50" data-modal-cancel>
        <div class="absolute inset-0 grid place-items-center">
            <div class="max-h-screenoverflow-y-auto w-full max-w-md rounded-lg bg-white p-6 shadow-lg dark:border-gray-700 dark:bg-gray-800"
                 tabindex="0">
                <h3 class="mb-2 text-lg font-semibold text-gray-700 dark:text-gray-400"
                    id="bulkDeleteModalLabel">{% trans "Delete" %}</h3>
                <p class="mb-4 text-sm text-gray-700 dark:text-gray-400">
                    {% blocktrans trimmed %}
                        Are you sure you want to delete selected records?
                    {% endblocktrans %}
                </p>
                <div class="flex justify-end gap-2">
                    <button type="submit"
                            class="cursor-pointer rounded-md bg-red-600 px-6 py-2 font-semibold text-white shadow transition hover:bg-red-700 focus:ring-2 focus:ring-red-400 focus:outline-none">
                        {% trans "Delete" %}
                    </button>
                    <button type="button"
                            class="cursor-pointer rounded-md bg-gray-100 px-6 py-2 font-semibold text-gray-700 shadow transition hover:bg-gray-200 focus:ring-2 focus:ring-gray-400 focus:outline-none dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-500"
                            data-modal-cancel
                            aria-label="Cancel">{% trans "Cancel" %}</button>
                </div>
            </div>
        </div>
    </div>
</div>
