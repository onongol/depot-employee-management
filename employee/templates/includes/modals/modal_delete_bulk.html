{% load static %}
{% load i18n %}
<div id="bulkDeleteModal"
     class="fixed inset-0 z-50 hidden"
     aria-labelledby="bulkDeleteModalLabel"
     aria-modal="true"
     role="dialog">
    <div class="absolute inset-0 bg-black/50" data-modal-cancel>
        <div class="absolute inset-0 grid place-items-center p-4">
            <div class="max-h-screen w-full max-w-md overflow-y-auto rounded-lg bg-white p-6 shadow-lg dark:border-gray-700 dark:bg-gray-800"
                 tabindex="0">
                <h3 class="mb-2 text-lg font-semibold text-gray-700 dark:text-gray-400"
                    id="bulkDeleteModalLabel">{% trans "Delete" %}</h3>
                <p class="mb-4 text-sm text-gray-700 dark:text-gray-400">
                    {% blocktrans trimmed %}
                        Are you sure you want to delete selected records?
                    {% endblocktrans %}
                </p>
                <div class="flex justify-end gap-2">
                    {% include "includes/buttons/modal_cancel_button.html" %}
                    {% include "includes/buttons/modal_delete_button.html" %}
                </div>
            </div>
        </div>
    </div>
</div>
