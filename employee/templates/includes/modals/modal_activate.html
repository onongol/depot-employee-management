{% load static %}

{% load i18n %}

<div
  id="activateModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
  aria-labelledby="activateModalLabel"
  aria-modal="true"
  role="dialog"
>
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full max-h-screen overflow-y-auto p-6 dark:bg-gray-800 dark:border-gray-700" tabindex="0">
    <h3 class="text-lg text-gray-700 font-semibold mb-2 dark:text-gray-400" id="activateModalLabel">
      {% trans "Activate" %}
    </h3>
    <p class="mb-4 text-gray-700 dark:text-gray-400">
      {% blocktrans trimmed %}
      Are you sure you want to activate <strong id="activateDetails"></strong>?<br>
      All records associated with this item will also be activated.
      {% endblocktrans %}
    </p>
    <div class="flex justify-end gap-2">
      <a
        id="activateLink"
        class="cursor-pointer px-6 py-2 rounded-md bg-green-600 text-white font-semibold shadow hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-400 transition"
        href="#"
      >
        {% trans "Activate" %}
      </a>
      <button
        type="button"
        class="cursor-pointer px-6 py-2 rounded-md bg-gray-100 text-gray-700 font-semibold shadow hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-500"
        data-modal-cancel
        aria-label="Cancel"
      >
        {% trans "Cancel" %}
      </button>
    </div>
  </div>
</div>
