{% load static %}
{% load i18n %}
<div id="updateModal"
     class="fixed inset-0 z-50 hidden"
     aria-labelledby="updateModalLabel"
     aria-modal="true"
     role="dialog">
    <div class="absolute inset-0 bg-black/50" data-modal-overlay>
        <div class="absolute inset-0 grid place-items-center p-4">
            <div class="max-h-screen w-full max-w-md overflow-y-auto rounded-lg bg-white p-6 shadow-lg dark:border-gray-700 dark:bg-gray-800"
                 tabindex="0">
                <h3 class="mb-2 text-lg font-semibold text-gray-700 dark:text-gray-400"
                    id="updateModalLabel">{% trans "Update" %}</h3>
                <p class="mb-4 text-sm text-gray-700 dark:text-gray-400">
                    {% blocktrans trimmed %}
                        Are you sure you want to update
                        <strong id="updateDetails"></strong>?
                        <br />
                        All future records will reflect these changes.
                    {% endblocktrans %}
                </p>
                <div class="flex justify-end gap-2" data-modal-cancel>
                    {% include "includes/buttons/modal_cancel_button.html" %}
                    <a id="updateLink"
                       class="cursor-pointer rounded-md bg-blue-600 px-6 py-2 font-semibold text-white shadow transition hover:bg-blue-700 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                       href="#">{% trans "Update" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
