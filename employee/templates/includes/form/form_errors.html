{% load i18n %}

<!-- Error messages block -->
{% if errors %}
  <div
    class="mb-4 rounded-md bg-red-50 p-4 text-red-600 relative shadow-sm transition-opacity duration-300 dark:bg-red-500/20 dark:text-red-400"
    role="alert"
    aria-live="assertive"
    id="form_error"
    aria-label="form_error"
  >
    <span class="font-semibold">{% trans "Error" %}!</span>
    <ul class="list-disc list-inside text-sm ml-4">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
    <button
      type="button"
      class="absolute right-2 top-2 p-1 rounded hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-400 transition dark:hover:bg-red-200/10"
      onclick="this.closest('[role=alert]').classList.add('hidden')"
      aria-label="Close"
    >
      <svg class="w-5 h-5" aria-hidden="true">
        <use href="#close"></use>
      </svg>
    </button>
  </div>
{% endif %}
