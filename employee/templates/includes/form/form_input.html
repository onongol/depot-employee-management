<div class="mb-4 flex flex-col md:flex-row items-start md:items-center">
    <label for="{{ id }}"
           class="md:w-1/5 mb-1 md:mb-0 text-sm text-gray-700 font-medium dark:text-gray-400">{{ label }}</label>
    <div class="w-full">
        <input type="{{ type }}"
               name="{{ name }}"
               id="{{ id }}"
               class="block w-full md:w-1/3 rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-gray-400 transition dark:bg-gray-700 dark:border-gray-600 dark:text-gray-400 dark:placeholder-gray-500 dark:focus:ring-gray-500 dark:focus:border-gray-500 {% if form_errors.errors %}border-red-600 focus:ring-red-600 focus:border-red-600 focus:text-red-600 dark:border-red-600 dark:focus:ring-red-600 dark:focus:border-red-600{% endif %}"
               value="{{ value|default:'' }}"
               aria-describedby="{% if errors %}{{ id }}_error{% endif %}"
               {% if required %}required{% endif %}
               {% if min %}min="{{ min }}"{% endif %}
               {% if max %}max="{{ max }}"{% endif %}
               {% if step %}step="{{ step }}"{% endif %}
               {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}>
        {% include "includes/form/field_errors.html" with field=form_errors %}
    </div>
</div>
