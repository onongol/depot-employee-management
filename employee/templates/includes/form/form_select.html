<div class="mb-4 flex flex-row items-center gap-2">
    <label for="{{ id }}"
           class="mb-1 w-1/5 text-sm font-medium text-gray-700 md:mb-0 dark:text-gray-400">{{ label }}</label>
    <div class="relative w-full">
        <div class="relative w-full md:w-1/3">
            <select name="{{ name }}"
                    id="{{ id }}"
                    class="w-full cursor-pointer appearance-none rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 pr-10 text-gray-700 transition focus:border-gray-400 focus:ring-2 focus:ring-gray-400 focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-gray-400 dark:focus:border-gray-500 dark:focus:ring-gray-500"
                    {% if required %}required{% endif %}>
                {% for value, option_label in choices %}
                    <option value="{{ value }}" {% if value == selected %}selected{% endif %}>{{ option_label }}</option>
                {% endfor %}
            </select>
            <!-- Custom arrow (SVG) -->
            <div class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 transform text-gray-700 dark:text-gray-400">
                <svg class="ml-1 h-4 w-4" aria-hidden="true">
                    <use href="#chevron-down"></use>
                </svg>
            </div>
        </div>
    </div>
</div>
