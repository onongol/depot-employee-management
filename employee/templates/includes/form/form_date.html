<div class="flex flex-col items-start md:flex-row md:items-center">
  {% if label %}
    {% if hide_label_mobile %}
      <label
        for="{{ id }}"
        class="mb-1 hidden text-sm font-medium text-gray-700 md:mb-0 md:block md:w-1/5 dark:text-gray-400"
      >
        {{ label }}
      </label>
    {% else %}
      <label for="{{ id }}" class="mb-1 text-sm font-medium text-gray-700 md:mb-0 md:w-1/5 dark:text-gray-400">
        {{ label }}
      </label>
    {% endif %}
  {% endif %}
  <div class="w-full">
    <input
      type="{{ type }}"
      name="{{ name }}"
      id="{{ id }}"
      class="js-flatpickr {% if form_errors.errors %}
        border-red-600 focus:ring-red-600 focus:border-red-600 focus:text-red-600 dark:border-red-600
        dark:focus:ring-red-600 dark:focus:border-red-600
      {% endif %} block w-full rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 text-gray-700 placeholder-gray-400 transition focus:border-gray-400 focus:ring-2 focus:ring-gray-400 focus:outline-none md:w-1/3 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-400 dark:placeholder-gray-500 dark:focus:border-gray-500 dark:focus:ring-gray-500"
      palaceholder="{{ placeholder|default:label }}"
      value="{{ value|default:'' }}"
      aria-describedby="{% if form_errors.errors %}{{ id }}_error{% endif %}"
      {% if required %}required{% endif %}
      {% if min %}min="{{ min }}"{% endif %}
      {% if max %}max="{{ max }}"{% endif %}
      {% if step %}step="{{ step }}"{% endif %}
      {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
    />
    {% include "includes/form/field_errors.html" with field=form_errors %}
  </div>
</div>
