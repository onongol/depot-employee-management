{% load i18n %}

<form 
  action="{% url 'logout' %}" 
  method="post" 
  class="block"
>
  {% csrf_token %}
  <button
    type="submit"
    class="flex items-center gap-3 w-full px-4 py-2 text-sm hover:bg-gray-200 transition dark:hover:bg-gray-700"
  >
    <svg class="w-5 h-5" aria-hidden="true">
      <use href="#signout"></use>
    </svg>
      {% trans 'Sign Out' %}
  </button>
</form>
