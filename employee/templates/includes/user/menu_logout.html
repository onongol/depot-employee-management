{% load i18n %}
<form action="{% url 'logout' %}" method="post" class="block">
    {% csrf_token %}
    <button type="submit"
            class="flex w-full cursor-pointer items-center gap-3 px-4 py-2 text-sm transition hover:bg-gray-200 dark:hover:bg-gray-700">
        <svg class="size-5" aria-hidden="true">
            <use href="#signout"></use>
        </svg>
        {% trans 'Sign out' %}
    </button>
</form>
