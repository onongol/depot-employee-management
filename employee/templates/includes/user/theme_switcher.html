{% load i18n %}
{% load static %}
<!-- Theme Switcher -->
<div class="group relative">
    <button type="button"
            class="flex w-full cursor-pointer items-center gap-3 px-4 py-2 text-sm transition hover:bg-gray-200 focus:outline-none dark:hover:bg-gray-700"
            id="theme-dropdown-btn"
            aria-haspopup="true"
            aria-expanded="false">
        <svg id="theme-icon" class="h-5 w-5 shrink-0">
            <use href="#sun-fill"></use>
        </svg>
        <span id="theme-label">{% trans "Theme" %}</span>
        <svg class="ml-auto h-4 w-4">
            <use href="#chevron-down"></use>
        </svg>
    </button>
    <!-- Dropdown theme menu -->
    <div class="absolute top-0 right-full z-20 hidden w-36 rounded-md border border-gray-200 bg-gray-50 py-2 shadow-sm dark:border-gray-600 dark:bg-gray-800 dark:text-gray-500"
         id="theme-dropdown-menu"
         role="menu"
         tabindex="0">
        <div class="group relative">
            <button type="button"
                    class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-left text-sm hover:bg-gray-100 dark:hover:bg-gray-700"
                    data-theme-value="light"
                    data-label="{% trans 'Light' %}">
                <svg id="theme-icon" class="h-5 w-5 shrink-0">
                    <use href="#sun-fill"></use>
                </svg>
                {% trans "Light" %}
            </button>
        </div>
        <div>
            <button type="button"
                    class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-left text-sm hover:bg-gray-100 dark:hover:bg-gray-700"
                    data-theme-value="dark"
                    data-label="{% trans 'Dark' %}">
                <svg id="theme-icon" class="h-5 w-5 shrink-0">
                    <use href="#moon-stars-fill"></use>
                </svg>
                {% trans "Dark" %}
            </button>
        </div>
        <div>
            <button type="button"
                    class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-left text-sm hover:bg-gray-100 dark:hover:bg-gray-700"
                    data-theme-value="auto"
                    data-label="{% trans 'Device' %}">
                <svg id="theme-icon" class="h-5 w-5 shrink-0">
                    <use href="#device"></use>
                </svg>
                {% trans "Device" %}
            </button>
        </div>
    </div>
</div>
