<button
  type="button"
  class="cursor-pointer flex items-center justify-center w-10 h-10 rounded-full text-sm font-medium text-gray-700 bg-gray-100 shadow transition hover:bg-gray-200 focus:outline-none focus:ring-0 mr-2 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-700"
  id="user-dropdown-btn"
  aria-haspopup="true"
  aria-expanded="false"
>
  {{ request.user.get_full_name|default:request.user.username|slice:":1"|upper }}
</button>
