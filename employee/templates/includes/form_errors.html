<!-- Error messages block -->
{% if errors %}
  <div
    class="mb-4 rounded-md border border-red-200 bg-red-50 p-4 text-red-600"
    role="alert"
    aria-live="assertive"
    id="form_error"
    aria-label="form_error"
  >
    <span class="font-semibold">Error!</span>
    <ul class="list-disc list-inside text-sm ml-4">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
