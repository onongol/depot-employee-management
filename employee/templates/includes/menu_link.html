<li>
  <a
    href="{% url url_name %}"
    class="px-4 py-2 rounded-md text-sm font-medium transition-colors
      {% if request.resolver_match.url_name == url_name %}
        bg-gray-200 text-gray-700 dark:bg-gray-900 dark:text-gray-500
      {% else %}
        text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-gray-500
      {% endif %}"
    {% if request.resolver_match.url_name == url_name %}aria-current="page"{% endif %}
  >
    {{ label }}
  </a>
</li>
