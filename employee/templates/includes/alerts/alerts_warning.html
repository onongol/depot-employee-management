{% load i18n %}
<div id="alert_warning"
     class="relative mb-4 flex w-full items-start rounded-md bg-yellow-50 p-4 text-yellow-800 shadow-sm transition-opacity duration-300 dark:bg-yellow-500/20 dark:text-yellow-400 dark:backdrop-blur-xl"
     role="alert"
     aria-live="polite">
    <div class="pr-2">
        <strong class="font-semibold">{% trans "Warning" %}!</strong>
        <br />
        <p class="text-sm">{{ message }}</p>
    </div>
    <button type="button"
            data-alert-close
            class="absolute top-2 right-2 cursor-pointer rounded p-1 transition hover:bg-yellow-100 focus:ring-2 focus:ring-yellow-400 focus:outline-none dark:hover:bg-yellow-200/10"
            aria-label="Close">
        <svg class="h-5 w-5" aria-hidden="true">
            <use href="#close"></use>
        </svg>
    </button>
</div>
