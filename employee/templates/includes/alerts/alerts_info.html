<!-- Attention Message -->
{% load i18n %}
<div class="relative mb-4 flex items-start rounded-md bg-blue-50 p-4 text-blue-800 shadow-sm transition-opacity duration-300 dark:bg-blue-500/20 dark:text-blue-400 dark:backdrop-blur-xl"
     role="alert"
     aria-live="polite">
    <div>
        <strong class="font-semibold">{% trans "Attention" %}!</strong>
        <br />
        <p class="text-sm">{{ message }}</p>
    </div>
    <button type="button"
            class="absolute top-2 right-2 cursor-pointer rounded p-1 transition hover:bg-blue-100 focus:ring-2 focus:ring-blue-400 focus:outline-none dark:hover:bg-blue-200/10"
            onclick="this.closest('[role=alert]').classList.add('hidden')"
            aria-label="Close">
        <svg class="h-5 w-5" aria-hidden="true">
            <use href="#close"></use>
        </svg>
    </button>
</div>
