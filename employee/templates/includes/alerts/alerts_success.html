<!-- Success Message -->
{% load i18n %}

<div class="relative w-full mb-4 flex items-start rounded-md shadow-sm bg-green-50 p-4 text-green-400 transition-opacity duration-300 dark:bg-green-500/20 dark:text-green-400"
     role="alert"
     aria-live="polite">
    <div>
        <strong class="font-semibold">{% trans "Success" %}!</strong>
        <br />
        <p class="text-sm">{{ message }}</p>
    </div>
    <button type="button"
            class="absolute cursor-pointer right-2 top-2 p-1 rounded hover:bg-green-100 focus:outline-none focus:ring-2 focus:ring-green-400 transition dark:hover:bg-green-200/10"
            onclick="this.closest('[role=alert]').classList.add('hidden')"
            aria-label="Close">
        <svg class="w-5 h-5" aria-hidden="true">
            <use href="#close"></use>
        </svg>
    </button>
</div>
