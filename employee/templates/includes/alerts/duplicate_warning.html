<!-- Reusable warning alert shown when creating Daily Work and Piecework for the same Employee, Work, Type, and Date. -->
{% load i18n %}
<div class="relative mb-4 hidden items-start rounded-md bg-blue-50 p-4 text-blue-800 shadow-sm transition-opacity duration-300 md:flex dark:bg-blue-500/20 dark:text-blue-400"
     role="alert"
     aria-live="polite">
    <div>
        <h4 class="mb-1 font-semibold">{% trans "Attention" %}!</h4>
        <span class="text-sm">
            {% blocktrans trimmed %}
                Duplicate entries are not allowed for this selection.
            {% endblocktrans %}
        </span>
    </div>
    <button type="button"
            class="absolute top-2 right-2 cursor-pointer rounded p-1 transition hover:bg-blue-100 focus:ring-2 focus:ring-blue-400 focus:outline-none dark:hover:bg-blue-200/10"
            onclick="this.parentElement.style.display='none'"
            aria-label="{% trans 'Close' %}">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>
