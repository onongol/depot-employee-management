<!-- Reusable list header with title and "Create" button. -->
{% load i18n %}

<div class="hidden lg:flex flex-col sm:flex-row justify-between mb-6 items-center gap-4">
    <h2 id="{{ header_id }}"
        class="lg:text-lg text-gray-700 font-semibold dark:text-gray-400">
        {{ title|default:_("Select a department") }}
    </h2>
    {% if create_url %}
        <a href="{{ create_url }}"
           class="hidden lg:inline-flex items-center gap-2 px-4 py-2 text-white bg-blue-700 hover:bg-blue-800 focus:ring-2 focus:ring-blue-300 font-medium rounded-3xl transition-colors">
            <svg class="w-5 h-5" aria-hidden="true">
                <use href="#plus"></use>
            </svg>
            {% trans "Create" as create_default %}
            {{ create_label|default:create_default }}
        </a>
    {% endif %}
</div>

{% if create_url %}
    <a href="{{ create_url }}"
       class="fixed bottom-6 right-6 z-40 inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-700 text-white shadow-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-300 transition lg:hidden"
       aria-label="{% trans 'Create' %}">
        <svg class="w-6 h-6" aria-hidden="true">
            <use href="#plus"></use>
        </svg>
        <span class="sr-only">{% trans "Create" %}</span>
    </a>
{% endif %}
