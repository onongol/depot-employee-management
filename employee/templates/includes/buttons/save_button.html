{% load i18n %}
<!-- Save active if employees exist -->
<button type="submit"
        {% if disable_if_no_employees and not employees %}disabled aria-disabled="true" class="px-6 py-2 rounded-md bg-blue-700 text-white font-semibold shadow opacity-50 cursor-not-allowed sm:ml-auto"{% else %}class="cursor-pointer px-6 py-2 rounded-md bg-blue-700 text-white font-semibold shadow hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-400 transition sm:ml-auto"{% endif %}>
    {% trans "Save" %}
</button>
