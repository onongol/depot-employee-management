<!-- includes/alert_warning_update.html -->
<div
  class="relative w-full mb-4 flex items-start rounded-md border border-yellow-300 bg-yellow-50 p-4 text-yellow-800"
  role="alert"
  aria-live="polite"
>
  <div>
    <h4 class="font-semibold mb-1">Warning!</h4>
    <p class="text-sm">
      All records associated with this {{ object_type }}
      <strong>{{ object_name }}</strong>
      will also be updated.
    </p>
  </div>
  <button
    type="button"
    class="absolute right-2 top-2 p-1 rounded hover:bg-yellow-100 focus:outline-none focus:ring-2 focus:ring-yellow-400"
    onclick="this.parentElement.style.display='none'"
    aria-label="Close"
  >
   <svg class="w-5 h-5" aria-hidden="true">
      <use href="#close"></use>
    </svg>
  </button>
</div>
