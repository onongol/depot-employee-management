<!-- Renders a password visibility toggle button for form inputs. Include with input_id and optional reveal_ms; toggles icons and relies on client-side JS to switch the input type. -->
{% load i18n %}
<button
  type="button"
  class="absolute top-9 right-3 cursor-pointer text-gray-500"
  data-password-toggle
  data-input-id="{{ input_id }}"
  data-reveal-ms="{{ reveal_ms|default:3000 }}"
  aria-label="{% trans 'Show or hide password' %}"
  aria-pressed="false"
>
  <svg data-icon="eye" class="size-5" aria-hidden="true">
    <use href="#eye"></use>
  </svg>
  <svg data-icon="eye-off" class="hidden size-5" aria-hidden="true">
    <use href="#eye-off"></use>
  </svg>
</button>
