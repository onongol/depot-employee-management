<!-- Renders a password visibility toggle button for form inputs. Include with input_id and optional reveal_ms; toggles icons and relies on client-side JS to switch the input type. -->

{% load static %}

{% load i18n %}

<button type="button"
  class="absolute cursor-pointer right-3 top-9 text-gray-500"
  data-reveal-ms="{{ reveal_ms|default:3000 }}"
  onclick="togglePasswordVisibility('{{ input_id }}', this)"
  tabindex="-1"
  aria-label="{% trans 'Show or hide password' %}"
>
  <svg id="eye-{{ input_id }}" class="w-5 h-5" aria-hidden="true">
    <use href="#eye"></use>
  </svg>
  <svg id="eye-off-{{ input_id }}" class="w-5 h-5 hidden" aria-hidden="true">
    <use href="#eye-off"></use>
  </svg>
</button>
