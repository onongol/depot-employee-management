{% load i18n %}
<div class="employee-table-container mb-4 overflow-hidden rounded-md border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-900">
    <div class="{{ max_height|default:'max-h-68' }} w-full overflow-x-auto overflow-y-auto">
        <table class="w-full bg-gray-50 text-left text-sm text-gray-500 dark:bg-gray-800 dark:text-gray-400"
               aria-describedby="daily-salary-list-title">
            <thead class="bg-gray-100 text-left text-xs tracking-wide text-gray-700 uppercase dark:bg-gray-700 dark:text-gray-400">
                <tr class="sticky top-0 z-10 bg-gray-100 dark:bg-gray-700">
                    {% with col_class="px-6 py-3" %}
                        <th scope="col" class="{{ col_class }} text-center">
                            <input type="checkbox"
                                   id="select-all-employees"
                                   data-checkbox-name="employee_ids"
                                   class="h-4 w-4 cursor-pointer"
                                   onclick="toggleAllVisible(this, 'employee_ids')"
                                   aria-label="Select all employees" />
                            <label for="select-all-employees" class="sr-only">{% trans "Select all" %}</label>
                        </th>
                        <th scope="col" class="{{ col_class }}">{% trans "ID" %}</th>
                        <th scope="col" class="{{ col_class }}">{% trans "Name" %}</th>
                        <th scope="col" class="{{ col_class }}">{% trans "Position" %}</th>
                    {% endwith %}
                </tr>
            </thead>
            <tbody id="employees-table-body"
                   class="divide-y divide-gray-100 dark:divide-gray-700">
                {% for employee in employees %}
                    <tr class="transition-colors odd:bg-white hover:bg-gray-200 has-checked:bg-blue-100 dark:odd:bg-gray-900 dark:hover:bg-gray-600 dark:has-checked:bg-blue-500/20"
                        data-emp-id="{{ employee.employee_id }}"
                        data-emp-name="{{ employee.name }}">
                        {% with col_class="px-6 py-3" %}
                            <td class="{{ col_class }} text-center align-middle">
                                <input type="checkbox"
                                       class="form-checkbox h-4 w-4 cursor-pointer"
                                       id="employee_{{ employee.pk }}"
                                       name="employee_ids"
                                       value="{{ employee.pk }}"
                                       aria-labelledby="label_employee_{{ employee.pk }}" />
                            </td>
                            <td class="{{ col_class }}">
                                <label id="label_employee_{{ employee.pk }}"
                                       for="employee_{{ employee.pk }}"
                                       class="sr-only">{{ employee.employee_id }}</label>
                                {{ employee.employee_id }}
                            </td>
                            <td class="{{ col_class }}">{{ employee.name }}</td>
                            <td class="{{ col_class }}">{{ employee.job_title }}</td>
                        {% endwith %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<div data-checkbox-validation="true"
     data-form-id="createForm"
     data-checkbox-name="employee_ids"
     data-table-selector=".employee-table-container"
     data-error-message="{{ _('Select at least one employee.') |escapejs }}"></div>
