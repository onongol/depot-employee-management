{% load i18n %}
<li class="mb-6 list-none lg:hidden" data-department-sheet>
    <button type="button"
            class="mr-2 flex w-56 cursor-pointer items-center justify-between gap-2 rounded-2xl bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 shadow transition hover:bg-gray-200 focus:ring-0 focus:outline-none dark:bg-gray-900 dark:text-gray-500 dark:hover:bg-gray-700"
            data-department-sheet-open
            aria-haspopup="dialog"
            aria-controls="department-sheet"
            aria-expanded="false">
        {% if selected_department %}
            {{ selected_department }}
        {% else %}
            {% trans "Department" %}
        {% endif %}
        <svg class="h-4 w-4" aria-hidden="true">
            <use href="#chevron-down"></use>
        </svg>
    </button>
    <div class="fixed inset-0 z-40 hidden bg-black/50"
         data-department-sheet-backdrop></div>
    <div id="department-sheet"
         class="fixed inset-x-0 bottom-0 z-50 hidden max-h-[75vh] overflow-auto rounded-t-2xl bg-white p-4 shadow-2xl dark:bg-gray-800"
         data-department-sheet-panel
         role="dialog"
         aria-modal="true"
         aria-label="{% trans 'Select department' %}">
        <div class="mx-auto mb-3 h-1.5 w-12 rounded-full bg-gray-300 dark:bg-gray-600"></div>
        <ul class="space-y-2 dark:text-gray-500">
            {% for department in departments %}
                <li>
                    <a href="{% url 'set_department' %}?department={{ department }}"
                       class="{% if department == selected_department %}font-bold bg-gray-300 text-gray-600 dark:bg-gray-900 dark:text-gray-400{% endif %} block w-full rounded-xl px-4 py-3 text-sm hover:bg-gray-200 dark:hover:bg-gray-700"
                       {% if department == selected_department %}aria-current="true"{% endif %}>{{ department }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</li>
