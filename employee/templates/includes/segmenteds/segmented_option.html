{% if active %}
    <a href="{{ href }}"
       class="rounded-lg bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition dark:bg-gray-900 dark:text-gray-400"
       aria-current="page">{% firstof label %}</a>
{% else %}
    <a href="{{ href }}"
       class="rounded-lg px-4 py-2 text-sm font-medium text-gray-500 transition hover:bg-gray-200 dark:text-gray-500 dark:hover:bg-gray-700">{% firstof label %}</a>
{% endif %}
