{% load i18n %}
<div class="flex flex-col gap-4 md:flex-row">
  <div class="flex flex-col">
    <span class="sr-only">{% trans "View" %}</span>
    {% if htmx_target %}
      <div
        class="inline-flex w-fit gap-1 rounded-xl border border-gray-300 bg-gray-100 p-1 dark:border-gray-600 dark:bg-gray-800"
        hx-boost="true"
        hx-target="{{ htmx_target }}"
        hx-select="{{ htmx_target }}"
        hx-swap="outerHTML"
        hx-push-url="true"
      >
        {% include options_template %}
      </div>
    {% else %}
      <div
        class="inline-flex w-fit gap-1 rounded-xl border border-gray-300 bg-gray-100 p-1 dark:border-gray-600 dark:bg-gray-800"
      >
        {% include options_template %}
      </div>
    {% endif %}
  </div>
</div>
