{% load i18n %}
<a class="hidden cursor-pointer items-center justify-between gap-2 rounded-full p-2 text-sm font-medium text-green-700 select-none hover:bg-gray-200 focus:ring-2 focus:ring-gray-400 focus:outline-none md:rounded-xl md:border md:border-gray-300 md:bg-gray-100 md:px-4 md:py-2 dark:text-green-700 dark:hover:bg-gray-700 md:dark:border-gray-600 md:dark:bg-gray-800"
   href=""
   title="{% trans 'Activate' %}"
   data-action-btn="activation"
   data-modal-open="activate"
   data-id=""
   data-name=""
   aria-label="Activate selected"
   aria-haspopup="dialog"
   aria-controls="activateModal">
    <span class="flex items-center gap-1">
        <svg class="size-5" aria-hidden="true">
            <use href="#archive"></use>
        </svg>
        <span class="hidden md:inline">{% trans "Activate" %}</span>
    </span>
</a>
