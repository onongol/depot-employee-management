{% load i18n %}
{% if show_delete|default:False %}
  <button
    type="button"
    class="{% if show_activation|default:False and not is_active %}opacity-50 cursor-not-allowed pointer-events-none{% endif %} flex cursor-pointer items-center gap-1 rounded bg-gray-100 px-2 py-1 text-gray-700 transition hover:bg-red-100 hover:text-red-700 focus:ring-1 focus:ring-red-400 focus:outline-none dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-red-700 dark:hover:text-white"
    aria-label="Delete {{ name }}"
    title="{% trans 'Delete' %}"
    data-modal-open="delete"
    data-id="{{ id }}"
    data-name="{{ name }}"
    data-url="{{ delete_url }}"
    aria-haspopup="dialog"
    aria-controls="deleteModal"
    {% if show_activation and not is_active %}tabindex="-1" aria-disabled="true"{% endif %}
  >
    <svg class="size-4" aria-hidden="true">
      <use href="#delete"></use>
    </svg>
  </button>
{% endif %}
