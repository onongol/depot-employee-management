{% load i18n %}

<button
  type="button"
  class="flex items-center px-2 py-1 rounded bg-gray-100 text-gray-700 hover:bg-red-100 hover:text-red-700 transition gap-1 focus:outline-none focus:ring-1 focus:ring-red-400 dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-red-700 dark:hover:text-white {% if show_activation|default:False and not is_active %}opacity-50 cursor-not-allowed pointer-events-none{% endif %}"
  aria-label="Delete {{ name }}"
  title="{% trans 'Delete' %}"
  data-id="{{ id }}"
  data-name="{{ name }}" 
  data-url="{{ delete_url }}"
  {% if show_activation and not is_active %}
    tabindex="-1" 
    aria-disabled="true"
  {% endif %}
>
  <svg class="w-4 h-4" aria-hidden="true">
    <use href="#delete"></use>
  </svg>
</button>
