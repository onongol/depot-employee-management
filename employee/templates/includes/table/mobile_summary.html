{% load i18n %}
<span class="hidden md:inline">{{ col_name }}</span>
<details class="group md:hidden">
    <summary class="flex w-full cursor-pointer list-none items-start justify-between gap-2">
        <span>{{ col_name }}</span>
        <svg class="h-4 w-4 transition-transform duration-200 group-open:rotate-180"
             aria-hidden="true">
            <use href="#chevron-down"></use>
        </svg>
    </summary>
    <div class="text-xs text-gray-500 opacity-70">{% include details_template %}</div>
</details>
