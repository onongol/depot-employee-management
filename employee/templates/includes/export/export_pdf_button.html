{% load i18n %}
{% url url_name as base_url %}
<a href="{{ base_url }}{% if params %}?{% for key, value in params.items %}{% if value %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}{% endif %}"
   class="{{ btn_class|default:'flex items-center justify-center p-2 md:px-4 md:py-2 md:gap-1 rounded-full md:rounded bg-gray-100 text-sm font-medium text-gray-700 hover:bg-red-100 hover:text-red-700 transition focus:outline-none focus:ring-1 focus:ring-red-400 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-red-700 dark:hover:text-white dark:focus:ring-red-400 md:w-24' }}"
   role="button"
   aria-label="{{ aria_label|default:'Download as PDF' }}"
   title="PDF"
   {% if target %}target="{{ target }}"{% endif %}>
    <svg class="size-5" aria-hidden="true">
        <use href="#download" />
    </svg>
    <span class="hidden md:block">{{ label|default:'PDF' }}</span>
</a>
