{% load i18n %}

{% url url_name as base_url %}

<a
  href="{{ base_url }}{% if params %}?{% for key, value in params.items %}{% if value %}{{ key }}={{ value|urlencode }}&{% endif %}{% endfor %}{% endif %}"
  class="{{ btn_class|default:'flex items-center justify-center px-4 py-2 rounded bg-gray-100 text-sm font-medium text-gray-700 hover:bg-red-100 hover:text-red-700 transition focus:outline-none focus:ring-1 focus:ring-red-400 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-red-700 dark:hover:text-white dark:focus:ring-red-400' }}"
  role="button"
  aria-label="{{ aria_label|default:'Download as PDF' }}"
  {% if target %}target="{{ target }}"{% endif %}
>
  <svg class="w-5 h-5 mr-1" aria-hidden="true"><use href="#download" /></svg>
  <span>{{ label|default:'PDF' }}</span>
</a>
