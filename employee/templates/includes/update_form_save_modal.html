{% load static %}

<!-- Confirmation Modal -->
<div
  id="saveModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
  aria-labelledby="saveModalLabel"
  aria-modal="true"
  role="dialog"
  aria-hidden="true"
  tabindex="-1"
  data-object-name="{{ object_name }}"
>
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6">
    <h5 class="text-lg text-gray-700 font-semibold mb-2" id="saveModalLabel">
      Save
    </h5>
    <p class="mb-4 text-gray-700">
      Are you sure you want to save updates
      <strong id="saveObjectDetails">{{ object_name }}</strong>?<br>
      All records associated with this item will also be updated.
    </p>
    <div class="flex justify-end gap-2">
      <button
        type="button"
        class="px-6 py-2 rounded-md bg-blue-700 text-white font-semibold shadow hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
        id="confirmSaveButton"
      >
        Save
      </button>
      <button
        type="button"
        class="px-6 py-2 rounded-md bg-gray-100 text-gray-700 font-semibold shadow hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition"
        onclick="document.getElementById('saveModal').classList.add('hidden')"
      >
        Cancel
      </button>
    </div>
  </div>
</div>

<script src="{% static 'js/update_form_save_modal.js' %}"></script>
