{% load i18n %}

<div
  id="saveDuplicateModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
  aria-labelledby="saveDuplicateModalLabel"
  aria-modal="true"
  role="dialog"
  aria-hidden="true"
>
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-0 dark:bg-gray-800 dark:border-gray-700">
    <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6 dark:bg-gray-800 dark:border-gray-700" tabindex="0">
      <h3 class="text-lg text-gray-700 font-semibold mb-2 dark:text-gray-400" id="saveDuplicateModalLabel">{% trans "Duplicate" %}</h3>
      <p class="mb-4 text-gray-700 dark:text-gray-400">
        {% trans "A Daily Work & Piecework entry already exists for:" %}
        <br>{% trans "Employee" %}: <strong id="modal-employee"></strong>,
        <br>{% trans "Work" %}: <strong id="modal-work"></strong>,
        <br>{% trans "Type" %}: <strong id="modal-type-work"></strong>,
        <br>{% trans "Wagon" %}: <strong id="modal-wagon-number"></strong>,
        <br>{% trans "Date" %}: <strong id="modal-work-date"></strong>.
        <br>{% trans "Are you sure you want to create a duplicate entry?" %}
      </p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          class="px-6 py-2 rounded-md bg-blue-700 text-white font-semibold shadow hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
          id="confirmSaveBtn"
          aria-label="{% trans 'Confirm save duplicate' %}"
        >
          {% trans "Save" %}
        </button>
        <button
          type="button"
          class="px-6 py-2 rounded-md bg-gray-100 text-gray-700 font-semibold shadow hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-500"
          data-modal-cancel
          aria-label="{% trans 'Cancel' %}"
        >
          {% trans "Cancel" %}
        </button>
      </div>
    </div>
  </div>
</div>
