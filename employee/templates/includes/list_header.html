{% load i18n %}

<div class="flex flex-col sm:flex-row justify-between mb-6 items-center gap-4">
  <h2
    id="{{ header_id|default:'list-title' }}"
    class="text-lg text-gray-700 font-semibold"
  >
    {{ title }}
  </h2>
  <a
    href="{{ create_url }}"
    class="w-full sm:w-auto inline-flex items-center gap-2 px-4 py-2 text-white bg-blue-700 hover:bg-blue-800 focus:ring-2 focus:ring-blue-300 font-medium rounded-3xl transition-colors"
  >
    <svg class="w-5 h-5" aria-hidden="true">
      <use href="#plus"></use>
    </svg>
    {% trans "Create" as create_default %}
    {{ create_label|default:create_default }}
  </a>
</div>
