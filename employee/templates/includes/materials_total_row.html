{% load i18n %}

<tr class="bg-blue-100 font-semibold dark:bg-blue-500/20">
  {% with col_class="px-6 py-3" %}
    <td class="{{ col_class }}">
      {% trans "Total" %}:
    </td>
    <td>
      {{ range_date }}
    </td>
    <td class="{{ col_class }}"></td>
    <td class="{{ col_class }}">
      {{ selected_type }}
    </td>
    <td class="{{ col_class }}">
      {{ sum_amount|floatformat:2 }}
    </td>
  {% endwith %}
</tr>
