<tr class="bg-blue-100">
  {% with col_class="px-6 py-3" %}
    <td class="{{ col_class }}"></td>
    <td>
      <strong>{{ start_date|date:"Y.m.d" }}</strong> -
      <strong>{{ end_date|date:"Y.m.d" }}</strong>
    </td>
    <td class="{{ col_class }}"></td>
    <td class="{{ col_class }}">
      <strong>{{ selected_type }}</strong>
    </td>
    <td class="{{ col_class }}">
      Total: <strong>{{ sum_amount|floatformat:2 }}</strong>
    </td>
  {% endwith %}
</tr>
