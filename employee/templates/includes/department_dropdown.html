<li class="relative">
  <button
    type="button"
    class="flex items-center gap-2 px-4 py-2 rounded-2xl text-sm font-medium text-gray-700 bg-gray-100 shadow transition hover:bg-gray-200 focus:outline-none focus:ring-0 mr-2"
    id="department-dropdown-btn"
    aria-haspopup="true"
    aria-expanded="false"
  >
    {% if selected_department %}
      {{ selected_department }}
    {% else %}
      Department
    {% endif %}
    <svg class="w-4 h-4 ml-1" aria-hidden="true">
      <use href="#chevron-down"></use>
    </svg>
  </button>
  <ul
    class="absolute left-0 mt-2 w-54 bg-gray-50 rounded-md shadow-sm z-10 py-2 hidden"
    id="department-dropdown-menu"
    tabindex="0"
  >
    {% for department in departments %}
      <li>
        <a
          href="{% url 'set_department' %}?department={{ department }}"
          class="block w-full px-4 py-2 text-sm hover:bg-gray-200 transition"
        >
          {{ department }}
        </a>
      </li>
    {% endfor %}
  </ul>
</li>
