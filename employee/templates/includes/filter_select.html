<div class="flex flex-col relative">
  <label for="{{ id }}" class="sr-only">{{ label }}</label>
  <select
    name="{{ name }}"
    id="{{ id }}"
    class="block w-full max-w-xs rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-gray-400 transition appearance-none pr-10"
  >
    {% if empty_label %}
      <option value="">{{ empty_label }}</option>
    {% endif %}
    {% for value in choices %}
      <option value="{{ value }}"{% if value == selected %} selected{% endif %}>
        {{ value }}
      </option>
    {% endfor %}
  </select>
  <!-- Custom arrow (SVG) -->
  <div class="pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2">
    <svg class="w-4 h-4 ml-1" aria-hidden="true">
      <use href="#chevron-down"></use>
    </svg>
  </div>
</div>
