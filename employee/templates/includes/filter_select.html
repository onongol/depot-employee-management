<!-- includes/filter_select.html -->
<div class="flex flex-col">
  <label for="{{ id }}" class="sr-only">{{ label }}</label>
  <select
    name="{{ name }}"
    id="{{ id }}"
    class="block w-full max-w-xs rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-gray-400 transition"
  >
    {% if empty_label %}
      <option value="">{{ empty_label }}</option>
    {% endif %}
    {% for value in choices %}
      <option value="{{ value }}"{% if value == selected %} selected{% endif %}>
        {{ value }}
      </option>
    {% endfor %}
  </select>
</div>
