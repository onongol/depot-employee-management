<!-- includes/table_action_buttons.html -->
<div class="flex gap-2">
  <!-- Edit Button -->
  <button
    type="button"
    class="flex items-center px-2 py-1 rounded bg-gray-100 text-gray-700 hover:bg-blue-100 hover:text-blue-700 transition gap-1 focus:outline-none focus:ring-1 focus:ring-blue-400"
    aria-label="Edit {{ name }}"
    title="Update"
    data-id="{{ id }}"
    data-name="{{ name }}"
    data-url="{{ edit_url }}"
  >
    <svg class="w-4 h-4" aria-hidden="true">
      <use href="#edit"></use>
    </svg>
  </button>

  <!-- Delete Button -->
  <button
    type="button"
    class="flex items-center px-2 py-1 rounded bg-gray-100 text-gray-700 hover:bg-red-100 hover:text-red-700 transition gap-1 focus:outline-none focus:ring-1 focus:ring-red-400"
    aria-label="Delete {{ name }}"
    title="Delete"
    data-id="{{ id }}"
    data-name="{{ name }}"
    data-url="{{ delete_url }}"
  >
    <svg class="w-4 h-4" aria-hidden="true">
      <use href="#delete"></use>
    </svg>
  </button>
</div>
