<div class="flex flex-col">
    <label for="{{ id }}" class="sr-only">{{ label }}</label>
    <input type="{{ type }}"
           name="{{ name }}"
           id="{{ id }}"
           class="js-flatpickr block rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 focus:ring-inset focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-gray-400 transition dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400 dark:focus:ring-gray-500 dark:focus:border-gray-500"
           placeholder="{{ placeholder|default:label }}"
           value="{{ value|default:'' }}"
           {% if min %}min="{{ min }}"{% endif %}
           {% if max %}max="{{ max }}"{% endif %}
           {% if step %}step="{{ step }}"{% endif %}>
</div>
