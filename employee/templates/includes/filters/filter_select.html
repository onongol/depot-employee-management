<div class="relative flex flex-col">
  <label for="{{ id }}" class="sr-only">{{ label }}</label>
  <select
    name="{{ name }}"
    id="{{ id }}"
    class="block w-full cursor-pointer appearance-none rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 pr-10 text-sm font-medium text-gray-700 placeholder-gray-400 transition focus:border-gray-400 focus:ring-2 focus:ring-gray-400 focus:outline-none focus:ring-inset dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400 dark:placeholder-gray-500 dark:focus:border-gray-500 dark:focus:ring-gray-500"
    {% if data_table %}data-table="{{ data_table }}"{% endif %}
    {% if data_column %}data-column="{{ data_column }}"{% endif %}
    {% if required %}required{% endif %}
  >
    {% if empty_label %}<option value="">{{ empty_label }}</option>{% endif %}
    {% for value in choices %}
      <option value="{{ value|escape }}" {% if value == selected %}selected{% endif %}>{{ value|escape }}</option>
    {% endfor %}
  </select>
  <!-- Custom arrow (SVG) -->
  <div
    class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 transform text-gray-700 dark:text-gray-400"
  >
    <svg class="ml-1 size-4" aria-hidden="true">
      <use href="#chevron-down"></use>
    </svg>
  </div>
</div>
