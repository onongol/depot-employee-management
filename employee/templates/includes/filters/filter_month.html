<div class="flex flex-col">
  <label for="{{ id }}" class="sr-only">{{ label }}</label>
  <input
    type="text"
    name="{{ name|default:'month_period' }}"
    id="{{ id }}"
    class="js-flatpickr-month block rounded-xl border border-gray-300 bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 transition focus:border-gray-400 focus:ring-2 focus:ring-gray-400 focus:outline-none focus:ring-inset dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400 dark:focus:border-gray-500 dark:focus:ring-gray-500"
    placeholder="{{ placeholder|default:label }}"
    value="{{ value|default:'' }}"
    autocomplete="off"
  />
</div>
