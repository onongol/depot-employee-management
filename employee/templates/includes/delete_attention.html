{% if messages %}
  {% for message in messages %}
    {% if message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}
      <div
        class="relative mb-4 flex items-start rounded-md border border-blue-200 bg-blue-50 p-4 text-blue-800"
        role="alert"
        aria-live="polite"
      >
        <div>
          <span class="font-semibold">Attention!</span><br />
          <span class="text-sm">{{ message|safe }}</span>
        </div>
        <button
          type="button"
          class="absolute right-2 top-2 p-1 rounded hover:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-400"
          onclick="this.parentElement.style.display='none'"
          aria-label="Close"
        >
          <svg class="w-5 h-5" aria-hidden="true">
            <use href="#close"></use>
          </svg>
        </button>
      </div>
    {% else %}
      <div
        class="relative mb-4 flex items-start rounded-md border border-yellow-300 bg-yellow-50 p-4 text-yellow-800"
        role="alert"
        aria-live="polite"
      >
        <div>
          <span class="font-semibold">Warning!</span><br />
          <span class="text-sm">{{ message|safe }}</span>
        </div>
        <button
          type="button"
          class="absolute right-2 top-2 p-1 rounded hover:bg-yellow-100 focus:outline-none focus:ring-2 focus:ring-yellow-400"
          onclick="this.parentElement.style.display='none'"
          aria-label="Close"
        >
          <svg class="w-5 h-5" aria-hidden="true">
            <use href="#close"></use>
          </svg>
        </button>
      </div>
    {% endif %}
  {% endfor %}
{% endif %}
