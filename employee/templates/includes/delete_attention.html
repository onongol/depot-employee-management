{% if messages %}
  {% for message in messages %}
    {% if message.level == DEFAULT_MESSAGE_LEVELS.WARNING %}
      <div
        class="relative mb-4 flex items-start rounded-md border border-blue-200 bg-blue-50 p-4 text-blue-800 transition-opacity duration-300"
        role="alert"
        aria-live="polite"
      >
        <div>
          <strong class="font-semibold">Attention!</strong><br />
          <p class="text-sm">{{ message }}</p>
        </div>
        <button
          type="button"
          class="absolute right-2 top-2 p-1 rounded hover:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-400"
          onclick="this.closest('[role=alert]').classList.add('hidden')"
          aria-label="Close"
        >
          <svg class="w-5 h-5" aria-hidden="true">
            <use href="#close"></use>
          </svg>
        </button>
      </div>
    {% else %}
      <div
        class="relative mb-4 flex items-start rounded-md border border-yellow-300 bg-yellow-50 p-4 text-yellow-800"
        role="alert"
        aria-live="polite"
      >
        <div>
          <strong class="font-semibold">Warning!</strong><br />
          <p class="text-sm">{{ message }}</p>
        </div>
        <button
          type="button"
          class="absolute right-2 top-2 p-1 rounded hover:bg-yellow-100 focus:outline-none focus:ring-2 focus:ring-yellow-400"
          onclick="this.closest('[role=alert]').classList.add('hidden')"
          aria-label="Close"
        >
          <svg class="w-5 h-5" aria-hidden="true">
            <use href="#close"></use>
          </svg>
        </button>
      </div>
    {% endif %}
  {% endfor %}
{% endif %}
