{% load static %}

<!-- Delete Modal -->
<div
  id="deleteModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
  aria-labelledby="deleteModalLabel"
  aria-modal="true"
  role="dialog"
  aria-hidden="true"
  tabindex="-1"
>
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6">
    <h3 class="text-lg text-gray-700 font-semibold mb-2" id="deleteModalLabel">
      Delete
    </h3>
    <p class="mb-4 text-gray-700">
      Are you sure you want to delete <strong id="deleteDetails"></strong>?<br>
      All records associated with this item will also be deleted.
    </p>
    <div class="flex justify-end gap-2">
      <form method="post" id="deleteForm">
        {% csrf_token %}
        <button
          type="submit"
          class="px-6 py-2 rounded-md bg-red-600 text-white font-semibold shadow hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-400 transition"
        >
          Delete
        </button>
      </form>
      <button
        type="button"
        class="px-6 py-2 rounded-md bg-gray-100 text-gray-700 font-semibold shadow hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition"
        onclick="document.getElementById('deleteModal').classList.add('hidden')"
      >
        Cancel
      </button>
    </div>
  </div>
</div>

<!-- Update Modal -->
<div
  id="updateModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden"
  aria-labelledby="updateModalLabel"
  aria-modal="true"
  role="dialog"
  aria-hidden="true"
  tabindex="-1"
>
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6">
    <h3 class="text-lg text-gray-700 font-semibold mb-2" id="updateModalLabel">
      Update
    </h3>
    <p class="mb-4 text-gray-700">
      Are you sure you want to update <strong id="updateDetails"></strong>?<br>
      All records associated with this item will also be updated.
    </p>
    <div class="flex justify-end gap-2">
      <a
        id="updateLink"
        class="px-6 py-2 rounded-md bg-green-600 text-white font-semibold shadow hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-400 transition"
        href="#"
      >
        Update
      </a>
      <button
        type="button"
        class="px-6 py-2 rounded-md bg-gray-100 text-gray-700 font-semibold shadow hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 transition"
        onclick="document.getElementById('updateModal').classList.add('hidden')"
      >
        Cancel
      </button>
    </div>
  </div>
</div>

<script src="{% static 'js/modals.js' %}"></script>
