{% load i18n %}

<div class="mt-6 flex gap-4">
    {% if not request.user.is_authenticated %}
        <a href="{% url 'login' %}"
           class="w-full sm:w-auto inline-flex items-center gap-2 px-4 py-2 text-white bg-blue-700 hover:bg-blue-800 focus:ring-2 focus:ring-blue-300 font-medium rounded-3xl transition-colors">
            {% trans 'Sign In' %}
        </a>
        <a href="{% url 'register' %}"
           class="w-full sm:w-auto inline-flex items-center gap-2 px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 focus:ring-2 focus:ring-gray-300 font-medium rounded-3xl transition-colors dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-gray-600 dark:focus:ring-gray-500">
            {% trans 'Register' %}
        </a>
    {% endif %}
</div>
