{% extends "account/base.html" %}
{% load i18n %}
{% block account_content %}
    <div class="rounded-md border border-gray-100 bg-white p-6 shadow-md dark:border-gray-700 dark:bg-gray-800">
        <h2 class="mb-4 text-lg font-semibold text-gray-700 dark:text-gray-400">{% trans 'Link invalid' %}</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400">{% trans "This confirmation link is invalid or has expired." %}</p>
        <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
            <a href="{% url 'account_signup' %}"
               class="text-blue-700 hover:underline dark:text-blue-400">{% trans "Register again" %}</a>
        </p>
    </div>
{% endblock %}
