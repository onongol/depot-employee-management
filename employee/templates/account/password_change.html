{% extends "account/base.html" %}
{% load i18n %}
{% block account_content %}
  <h2 class="mb-6 text-lg font-semibold text-gray-700 dark:text-gray-400">{% trans 'Change password' %}</h2>
  <form
    method="post"
    class="rounded-md border border-gray-100 bg-white p-6 shadow-md dark:border-gray-700 dark:bg-gray-800"
  >
    {% csrf_token %}
    {% include "includes/account/form_fields.html" %}
    <div class="mt-6">
      <button
        type="submit"
        class="w-full cursor-pointer rounded-md bg-blue-700 px-6 py-2 font-semibold text-white shadow transition hover:bg-blue-800 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        aria-label="Change password"
      >
        {% trans 'Change' %}
      </button>
      <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
        {% trans "Forgot your" %}
        <a href="{% url 'account_reset_password' %}" class="text-blue-700 hover:underline dark:text-blue-400"
          >{% trans "password" %}</a
        >?
      </p>
      <p class="mt-2 text-center text-sm text-gray-500 dark:text-gray-400">
        <a href="{% url 'account_overview' %}" class="text-blue-700 hover:underline dark:text-blue-400"
          >{% trans "Back to Account" %}</a
        >
      </p>
    </div>
  </form>
{% endblock %}
