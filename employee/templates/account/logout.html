{% extends "account/base.html" %}
{% load i18n %}
{% block account_content %}
  <div class="rounded-md border border-gray-100 bg-white p-6 shadow-md dark:border-gray-700 dark:bg-gray-800">
    <h2 class="mb-4 text-lg font-semibold text-gray-700 dark:text-gray-400">{% trans 'Sign out' %}</h2>
    <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">{% trans "Are you sure you want to sign out?" %}</p>
    <form method="post">
      {% csrf_token %}
      <button
        type="submit"
        class="w-full cursor-pointer rounded-md bg-blue-700 px-6 py-2 font-semibold text-white shadow transition hover:bg-blue-800 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        aria-label="Sign out"
      >
        {% trans 'Sign out' %}
      </button>
    </form>
  </div>
{% endblock %}
