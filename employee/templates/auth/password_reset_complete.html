{% extends "base.html" %}
{% load i18n %}
{% block content %}
    <div class="mx-auto mt-10 max-w-md">
        <div class="rounded-md border border-gray-100 bg-white p-6 shadow-md dark:border-gray-700 dark:bg-gray-800">
            <h2 class="mb-4 text-lg font-semibold text-gray-700 dark:text-gray-400">{% trans 'Password reset' %}</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400">{% trans "Your password has been set. You can sign in now." %}</p>
            <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
                <a href="{% url 'login' %}"
                   class="text-blue-700 hover:underline dark:text-blue-400">{% trans "Sign in" %}</a>
            </p>
        </div>
    </div>
{% endblock %}
