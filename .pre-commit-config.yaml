exclude: '/migrations/|^static/|^staticfiles/|^venv/|package-lock\.json'
default_stages: [pre-commit]
default_language_version:
  python: python3.13
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Prettier is the only formatter for templates: it and djlint --reformat
  # rewrite each other's output forever, so djLint below only lints.
  # This list replaces the hook's own dependencies, so prettier itself
  # has to be here too. All three must match package.json.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        files: \.(html|css|ts|js)$
        additional_dependencies:
          - prettier@3.9.6
          - prettier-plugin-jinja-template@2.2.0
          - prettier-plugin-tailwindcss@0.8.1

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.32.0
    hooks:
      - id: django-upgrade
        args: ["--target-version", "5.2"]

  # rev must match the ruff pin in requirements.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Lint only - formatting belongs to Prettier. rev must match requirements.txt.
  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      - id: djlint-django

  # tsc checks the whole project at once, so it runs on push rather than per commit.
  - repo: local
    hooks:
      - id: typecheck
        name: tsc --noEmit
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: \.ts$
        stages: [pre-push]

ci:
  autoupdate_schedule: weekly
