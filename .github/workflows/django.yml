name: Django CI

on:
  push:
    branches:
      - "feature/django-permissions-migration"
  pull_request:
    branches:
      - "feature/django-permissions-migration"
jobs:
  # Catches what a local --no-verify or an edit through the GitHub web UI skips.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      # Must precede pre-commit: the prettier hook runs from node_modules.
      - name: Install Node Dependencies
        run: npm ci

      - uses: pre-commit/action@v3.0.1
      # Separate step: the hook runs on pre-push, so `run --all-files` skips it.
      - name: Type Check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13"]

    env:
      DJANGO_SETTINGS_MODULE: depo_crud.settings.test
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      ALLOWED_HOSTS: .railway.app,.example.com
      CSRF_TRUSTED_ORIGINS: https://example.com
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build
      - name: Collect Static Files
        run: |
          python manage.py collectstatic --noinput
      - name: Deployment Checks
        env:
          DJANGO_SETTINGS_MODULE: depo_crud.settings.production
        run: |
          python manage.py check --deploy --fail-level WARNING

      - name: Grant Test Database Privileges
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "GRANT ALL PRIVILEGES ON \`test\_%\`.* TO '$MYSQL_USER'@'%'; FLUSH PRIVILEGES;"
      - name: Run Tests
        # The threshold lives here, not in pyproject: a local `pytest --cov -k ...`
        # measures a subset and would trip the gate on every partial run.
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      # Kept on failure too - the report is what explains a threshold miss.
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
