name: Django CI

on:
  push:
    branches: 
      - "feature/replace-bootstrap-with-tailwind"
      - "upgrade/django-5.2.9"
      - "vite-javascript"
      - "transition-to-typescript"
      - "feature/custom-admin-history"
      - "feature/htmx-integration"
      - "feature/add-soft-delete"
      - "feature/database-rebuild"
      - "feature/django-vite-integration"
  pull_request:
    branches:
      - "feature/replace-bootstrap-with-tailwind"
      - "upgrade/django-5.2.9"
      - "vite-javascript"
      - "transition-to-typescript"
      - "feature/custom-admin-history"
      - "feature/htmx-integration"
      - "feature/add-soft-delete"
      - "feature/database-rebuild"
      - "feature/django-vite-integration"
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build
      - name: Collect Static Files
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "False"
          ALLOWED_HOSTS: .railway.app,.example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
        run: |
          python manage.py collectstatic --noinput
      - name: Run Tests
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "False"
          ALLOWED_HOSTS: .railway.app,.example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
        run: |
          python manage.py test
